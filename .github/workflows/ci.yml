name: ci
on:
  push:
    paths: ['modules/**', 'lualib/**']
  pull_request:
jobs:
  luacheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: leafo/gh-actions-lua@v10
        with:
          luaVersion: "5.1"
      - uses: leafo/gh-actions-luarocks@v4
      - run: luarocks install luacheck
      # предупреждения (код 1) допустимы, ошибки (код 2+) валят сборку
      - run: luacheck modules/ --globals mw frame --codes || test $? -eq 1
